    <style>
        * {

            padding: 0;

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #F5F5DC; /* Color Marfil */
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff; /* Tarjeta blanca */
            border: 1px solid #e5e5e5;
            border-radius: 8px; /* Bordes menos redondeados, más clásicos */
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08); /* Sombra elegante */
            text-align: center; /* Contenido centrado */
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: 300;
            color: #444444;
            border: 1px solid #dddddd;
        }

        .info h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .info p {
            font-size: 13px;
            color: #777777;
            letter-spacing: 0.5px;
        }

        .vcard-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background-color: #222222; /* Botón oscuro elegante */
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            margin-bottom: 16px;
            transition: background-color 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .vcard-btn:hover {
            background-color: #444444;
        }
        
        .vcard-btn:active {
            transform: scale(0.99);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center; /* Texto centrado */
            padding: 12px 16px;
            background-color: transparent;
            color: #444444;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 400;
            border: 1px solid #e0e0e0;
            transition: all 0.2s ease;
        }

        .link-item:hover {
            background-color: #fafafa;
            border-color: #cccccc;
        }

        /* Ocultar iconos SVG para un look más limpio y minimalista */
        .link-item svg {
            display: none;
        }

        .footer {
            margin-top: 32px;
            font-size: 11px;
            color: #999999;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
